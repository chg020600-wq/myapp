<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스터디 녹음장</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1c1c1e;--sub:#6b6b73;--bd:#e0e0e6;--pri:#3b6cf6;--pt:#fff;--danger:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#111;--tx:#ececf0;--sub:#8e8e98;--bd:#26262b;--pri:#5b8cff;--pt:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#111;--tx:#ececf0;--sub:#8e8e98;--bd:#26262b;--pri:#5b8cff;--pt:#000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pt);border-color:var(--pri)}
button.dng{color:var(--danger)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;outline:none}
input:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:90px}
.app{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:16px;max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.pane{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:19px;margin:0}h2{font-size:18px;margin:6px 0}h3{margin:0 0 8px}
.ic{width:40px;height:40px;padding:0;display:inline-grid;place-items:center;border-radius:50%;margin-left:6px}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;border-radius:99px}
.chip.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:0}
.sp{justify-content:space-between}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.ch:last-child{border:0}.ch.on{background:color-mix(in srgb,var(--pri) 14%,transparent)}
.ov2{position:fixed;inset:0;z-index:20}
.pop{position:fixed;min-width:170px;max-width:260px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:14px}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:7px}
.pop button:hover,.pop button:active{background:color-mix(in srgb,var(--pri) 18%,transparent)}
.pop .hd{padding:6px 12px 4px;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{text-align:left;padding:12px}
.im{margin-top:10px}
.im img{width:100%;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in;background:var(--bg);min-height:40px;display:block;margin-bottom:4px}
.xp{padding:6px 8px 12px;text-align:center;border-bottom:1px solid var(--bd)}
.xp video,.xp img{max-width:100%;max-height:50vh;border-radius:10px;background:#000}
.xp audio{width:100%}
.pl{width:34px;height:34px;padding:0;border-radius:50%;flex:none;font-size:12px}
.ch small,.sub{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:18px 8px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
details summary{cursor:pointer;color:var(--sub);padding:4px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns button{flex:1;min-width:90px}
.pv{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;overflow:hidden}
.pv video,.pv img{max-width:100%;max-height:60vh;border-radius:10px}
.pv audio{width:100%}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}
.h.on{border-color:var(--pri)}
.h>span:first-child{min-width:0;flex:1}
.h .acts{display:flex;gap:4px;flex:none;overflow:visible}
.h .acts button{padding:5px 6px}
.h button.on:not(.pri){color:#f5b301;border-color:#f5b301}
.h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:4px}
.bt{font-weight:600;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ch{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ch.lift{position:relative;z-index:5;background:var(--card);box-shadow:0 8px 22px rgba(0,0,0,.4);outline:1px solid var(--pri)}
.ch.dim{opacity:.35}
.ch{-webkit-tap-highlight-color:transparent}
#list .ch *{-webkit-user-select:none;user-select:none}
.gr{touch-action:none;cursor:grab;color:var(--sub);padding:6px 4px;font-size:18px;line-height:1}
.ch.ins{box-shadow:0 -3px 0 var(--pri)}
.ch.insend{box-shadow:0 3px 0 var(--pri)}
.ex{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:0;font-size:13px;overflow:auto;white-space:pre}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:20}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;width:min(440px,100%);max-height:90vh;overflow:auto}
.box .row{justify-content:flex-end;margin-top:12px}
.box video{width:100%;border-radius:10px;background:#000;max-height:50vh}
.rd{color:var(--danger);font-weight:700;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;display:none;max-width:90vw}
@media(max-width:800px){.app{grid-template-columns:1fr}.app.det #list{display:none}.app:not(.det) #det{display:none}.back{display:inline-block}}
</style>
</head>
<body>
<div class="app" id="app"><section class="pane" id="list"></section><section class="pane" id="det"></section></div>
<div id="modal"></div><div id="modal2"></div><div id="toast"></div>
<input type="file" id="fi" multiple hidden><input type="file" id="ci" multiple hidden><input type="file" id="ii" accept="image/*" multiple hidden><input type="file" id="ti" accept=".txt,.csv,.md,text/plain" hidden><input type="file" id="bi" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

let db=null,mem={kv:{},blobs:{}},S={subjects:[],cur:null,theme:'dark'},view={ch:null,sel:null},urlCur=null,saveT=null,R=null;

/* ---------- storage ---------- */
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('studyrec',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function idb(st,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const get=(st,k)=>db?idb(st,'readonly',o=>o.get(k)):Promise.resolve(mem[st][k]);
const put=(st,k,v)=>db?idb(st,'readwrite',o=>o.put(v,k)):(mem[st][k]=v,Promise.resolve());
const del=(st,k)=>db?idb(st,'readwrite',o=>o.delete(k)):(delete mem[st][k],Promise.resolve());
const persist=()=>put('kv','data',JSON.parse(JSON.stringify(S))).catch(()=>toast('저장 실패: 저장공간을 확인하세요'));
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(persist,400)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}

/* ---------- helpers ---------- */
const sub=()=>S.subjects.find(x=>x.id===S.cur);
const ch=()=>{const s=sub();return s&&s.ch.find(c=>c.id===view.ch)};
const fdate=t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const kind=m=>/^audio/.test(m)?'a':/^video/.test(m)?'v':/^image/.test(m)?'i':'o';
const icon=m=>({a:'🎤',v:'🎥',i:'🖼',o:'📄'}[kind(m)]);
function applyTheme(){document.documentElement.dataset.theme=S.theme}
function dlg(o){return new Promise(r=>{const m=$('#modal');m.innerHTML=`<div class="ov"><div class="box"><h3>${esc(o.t)}</h3>${o.p?`<p class="sub">${esc(o.p)}</p>`:''}${o.i!=null?`<input id="di" value="${esc(o.i)}">`:''}<div class="row"><button data-d="0">취소</button><button class="pri ${o.dng?'dng':''}" data-d="1">${o.ok||'확인'}</button></div></div></div>`;
const i=$('#di');if(i){i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter')m.querySelector('[data-d="1"]').click()}}
m.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;m.innerHTML='';m.onclick=null;r(b.dataset.d==='1'?(i?i.value.trim():true):null)}})}
async function dl(name,data){
  try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return true}}}
  catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rejected_extension')return 'ext';}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){toast('저장 실패');return false}
}

/* ---------- render: list ---------- */
function rList(){
  const s=sub();
  $('#list').innerHTML=`<div class="top"><h1>🎙 스터디 녹음장</h1><span><button class="ic" data-a="theme" title="테마 전환">${S.theme==='dark'?SUN:MOON}</button><button class="ic" data-a="set" title="설정">${GEAR}</button></span></div>
  <div class="chips">${S.subjects.map(x=>`<button class="chip ${x.id===S.cur?'on':''}" data-a="subj" data-id="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" data-a="addsub">+ 과목</button></div>
  ${!s?'<div class="empty">먼저 과목을 추가하세요<br>(예: 국어, 해부학, 한국사)</div>':`
  <div class="card"><div class="row sp"><b>${esc(s.name)}</b><span><button data-a="rensub">이름</button> <button class="dng" data-a="delsub">삭제</button></span></div></div>
  <div class="card">${s.ch.length?s.ch.map(c=>`<div class="ch ${c.id===view.ch?'on':''}" data-a="open" data-id="${c.id}" style="padding-left:${8+c.d*14}px"><span>${c.d?'<small class="sub">└ </small>':''}${esc(c.t)}</span><span class="row" style="flex-wrap:nowrap;gap:6px"><small>${c.f.length?'📎'+c.f.length:''}${c.s?' ✍':''}</small>${c.f.length?`<button class="pl" data-a="exp" data-id="${c.id}" title="펼쳐서 최신 자료 보기">${expanded.has(c.id)?'▴':'▾'}</button>`:''}${quickF(c)?`<button class="pl ${playing===c.id?'pri':''}" data-a="play" data-id="${c.id}" data-pl="${c.id}" title="최신 녹음 재생/정지">${playing===c.id?'❚❚':'▶'}</button>`:''}${s.ch.length>1?'<span class="gr" title="끌어서 순서 변경">⠿</span>':''}</span></div>${expanded.has(c.id)?`<div class="xp" data-xp="${c.id}"></div>`:''}`).join(''):'<div class="empty">목차를 추가해보세요</div>'}${s.ch.length>1?'<div class="sub" style="padding:6px 8px 0">💡 목차를 꾹 눌렀다 떼면 메뉴(하위로·상위로 등), 꾹 누른 채 끌면 순서 변경 (오른쪽 ⠿ 로도 끌 수 있어요) </div>':''}</div>
  <div class="card"><div class="row sp"><b>🖼 목차 이미지</b><button data-a="addimg">+ 이미지 추가</button></div>${(s.im||[]).length?s.im.map(i=>`<div class="im"><img data-a="zoom" data-im="${i.id}" alt="${esc(i.n)}"><div class="row sp"><small class="sub">${esc(i.n)}</small><span><button data-a="renf" data-id="${i.id}" title="이름 변경">✏</button> <button data-a="dlf" data-id="${i.id}" title="다운로드">⬇</button> <button class="dng" data-a="delimg" data-id="${i.id}">✕</button></span></div></div>`).join(''):'<div class="sub" style="margin-top:6px">교재 목차 사진을 올려두고 보면서 공부하세요.</div>'}</div>
  <div class="card"><div class="row"><input id="q" placeholder="목차 입력 후 Enter (하위는 > 또는 공백 2칸)"><button class="pri" data-a="addch">추가</button></div>
  <details open><summary>여러 개 붙여넣기 · 파일로 불러오기</summary>
  <label>한 줄에 하나씩 (앞에 공백/탭 2칸 = 소단원)</label>
  <textarea id="bulk" placeholder="1장 세포\n  1-1 세포막\n  1-2 핵\n2장 조직"></textarea>
  <div class="row" style="margin-top:8px"><button class="pri" data-a="bulk">붙여넣은 목차 추가</button><button data-a="tfile">📄 파일 불러오기</button><button data-a="guide">❓ 형식·예시</button></div></details></div>
  <details id="edbox" class="card" ${edOpen?'open':''}><summary>✏ 목차 전체 수정</summary><p class="sub">한 줄이 목차 하나예요. 공백 2칸마다 한 단계 하위가 돼요. 이름을 고치면 파일·메모는 유지되고, 줄을 지우면 삭제, 새 줄은 추가돼요.</p><textarea id="ed2" wrap="off" spellcheck="false" style="min-height:40vh;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto">${esc(s.ch.map(c=>'  '.repeat(c.d)+c.t).join('\n'))}</textarea><div class="row" style="margin-top:8px"><button class="pri" data-a="edapply2">적용</button><button data-a="edreset">되돌리기</button></div></details>`}`;
  const q=$('#q');if(q)q.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)addCh()};fillXp();fillIm();
}
function splitCsv(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const x=l[i];if(x==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){o.push(c);c=''}else c+=x}o.push(c);return o}
function parseToc(t,csv){return t.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>{if(!l.trim())return null;
 if(csv){const cells=splitCsv(l).map(x=>x.trim());const i=cells.findIndex(Boolean);return i<0?null:{t:cells[i],d:Math.min(6,i)}}
 const h=l.match(/^(#{1,6})\s+(.+)/);if(h)return{t:h[2].trim(),d:Math.min(6,h[1].length-1)};
 const gt=l.match(/^\s*(>+)\s*(.+)/);if(gt)return{t:gt[2].trim(),d:Math.min(6,gt[1].length)};
 const ws=l.match(/^[ \t]*/)[0].replace(/\t/g,'  ').length;const s=l.trim().replace(/^[-*•·]\s+/,'');
 let d=Math.min(6,Math.floor(ws/2));if(!ws){const n=s.match(/^\d+((?:[.-]\d+)+)/);if(n)d=Math.min(6,n[1].split(/[.-]/).length-1)}
 return s?{t:s,d}:null}).filter(Boolean)}
const SAMPLES={txt:{n:'목차-예시.txt',d:'1장 세포\n  1-1 세포막\n  1-2 핵\n2장 조직\n  2-1 상피조직\n  2-2 결합조직\n'},csv:{n:'목차-예시.csv',d:'1장 세포,,\n,1-1 세포막,\n,1-2 핵,\n2장 조직,,\n,2-1 상피조직,\n,2-2 결합조직,\n'},md:{n:'목차-예시.md',d:'# 1장 세포\n## 1-1 세포막\n## 1-2 핵\n# 2장 조직\n## 2-1 상피조직\n## 2-2 결합조직\n'}};
let pendingToc=null;
function previewToc(items,name){if(!sub()){toast('먼저 과목을 추가하세요');return}pendingToc=items;$('#modal2').innerHTML=`<div class="ov"><div class="box"><h3>목차 미리보기</h3><p class="sub">${esc(name)} · ${items.length}개 항목 → "${esc(sub().name)}"에 추가</p><div style="max-height:45vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:6px">${items.map(i=>`<div style="padding:3px 6px 3px ${6+i.d*18}px">${esc(i.t)}</div>`).join('')}</div><div class="row"><button data-a="closeset">취소</button><button class="pri" data-a="tconfirm">${items.length}개 추가</button></div></div></div>`}

  catch(e){recFallback(video,'마이크/카메라 권한이 없거나 차단됐어요.');return}
  const mr=new MediaRecorder(stream),chunks=[];let sec=0,cancel=false;

    const m=mr.mimeType||(video?'video/webm':'audio/webm');const d=new Date(),p=n=>String(n).padStart(2,'0');
    await addFile(new Blob(chunks,{type:m}),(video?'영상 ':'녹음 ')+`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`,m);toast('저장되었어요')};

function makeMedia(video){

  [262,330,392,523,392,330].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=t+i*.5;o.frequency.value=f;o.connect(g);g.connect(dest);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.05);g.gain.linearRampToValueAtTime(0,s+.45);o.start(s);o.stop(s+.5)});

  if(video){const cv=document.createElement('canvas');cv.width=480;cv.height=270;const x=cv.getContext('2d'),t0=performance.now();
    const draw=()=>{const s=(performance.now()-t0)/1000;x.fillStyle='#1d2b53';x.fillRect(0,0,480,270);x.fillStyle='#5b8cff';x.beginPath();x.arc(240+Math.sin(s*2)*120,150+Math.cos(s*3)*40,34,0,7);x.fill();x.fillStyle='#fff';x.font='bold 24px sans-serif';x.textAlign='center';x.fillText('예시 영상 · '+s.toFixed(1)+'s',240,48);raf=requestAnimationFrame(draw)};draw();
    tracks=tracks.concat(cv.captureStream(24).getVideoTracks())}
  const mr=new MediaRecorder(new MediaStream(tracks)),ch=[];
  return new Promise(res=>{mr.ondataavailable=e=>e.data.size&&ch.push(e.data);mr.onstop=()=>{cancelAnimationFrame(raf);ac.close();res(new Blob(ch,{type:mr.mimeType||(video?'video/webm':'audio/webm')}))};mr.start();setTimeout(()=>mr.stop(),3100)})}
function wavBlob(){const sr=8000,n=sr*3,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(2*Math.PI*[262,330,392][Math.floor(i/sr)]*i/sr)*9000,true);return new Blob([b],{type:'audio/wav'})}

function planEdit(old,items){const n=old.length,m=items.length,K=(t,d)=>t+'\u0001'+d,dp=Array.from({length:n+1},()=>new Int32Array(m+1));

  const pair=new Array(m).fill(-1),an=[];let i=0,j=0;
  while(i<n&&j<m){if(K(old[i].t,old[i].d)===K(items[j].t,items[j].d)){an.push([i,j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  let pi=0,pj=0;for(const [ai,aj] of [...an,[n,m]]){const c=Math.min(ai-pi,aj-pj);for(let k=0;k<c;k++)pair[pj+k]=pi+k;if(ai<n)pair[aj]=ai;pi=ai+1;pj=aj+1}

  else if(a==='rensub'){const n=await dlg({t:'과목 이름',i:s.name});if(n){s.name=n;persist();rList()}}
  else if(a==='delsub'){if(await dlg({t:'과목 삭제',p:`"${s.name}"과 안의 모든 자료가 삭제됩니다.`,ok:'삭제',dng:true})){for(const f of [...(s.im||[]),...s.ch.flatMap(x=>x.f)])await del('blobs',f.id);S.subjects=S.subjects.filter(x=>x!==s);S.cur=S.subjects[0]?.id||null;view={ch:null,sel:null};persist();render()}}
  else if(a==='open'){view={ch:id,sel:null};rList();rDet();scrollTo(0,0)}
  else if(a==='back'){view={ch:null,sel:null};render()}
  else if(a==='addch')addCh();
  else if(a==='bulk'){addItems(parseToc($('#bulk').value));$('#bulk').value=''}
  else if(a==='tfile')$('#ti').click();
  else if(a==='guide')guide();
  else if(a==='sdl'){const k=b.dataset.k;dl(SAMPLES[k].n,(k==='csv'?'\uFEFF':'')+SAMPLES[k].d)}
  else if(a==='sfill'){const k=b.dataset.k;previewToc(parseToc(SAMPLES[k].d,k==='csv'),SAMPLES[k].n)}
  else if(a==='tconfirm'){$('#modal2').innerHTML='';addItems(pendingToc||[]);pendingToc=null}
  else if(a==='demo'){$('#modal2').innerHTML='';loadDemo()}
  else if(a==='ccap'){const ci=$('#ci');ci.accept=b.dataset.v==='1'?'video/*':'audio/*';ci.setAttribute('capture','');$('#modal2').innerHTML='';ci.click()}
  else if(a==='rench'){const n=await dlg({t:'목차 이름',i:c.t});if(n){c.t=n;persist();render()}}
  else if(a==='delch'){if(await dlg({t:'목차 삭제',p:'이 목차의 녹음·파일·메모가 모두 삭제됩니다.',ok:'삭제',dng:true})){for(const f of c.f)await del('blobs',f.id);s.ch=s.ch.filter(x=>x!==c);view={ch:null,sel:null};persist();render()}}
  else if(a==='reca')startRec(false);else if(a==='recv')startRec(true);
  else if(a==='files')$('#fi').click();
  else if(a==='rstop'&&R)R.stop();else if(a==='rcancel'&&R)R.cancel();
  else if(a==='sel'){if(e.target.closest('button'))return;view.sel=id;rHist();pv()}
  else if(a==='dlf'){e.stopPropagation();dlFile(id)}
  else if(a==='delf'){e.stopPropagation();if(await dlg({t:'파일 삭제',p:'이 파일을 삭제할까요?',ok:'삭제',dng:true})){await del('blobs',id);c.f=c.f.filter(x=>x.id!==id);if(c.main===id)c.main=null;if(view.sel===id)view.sel=null;await persist();rList();rHist();pv()}}
});
$('#fi').onchange=async e=>{for(const f of e.target.files)await addFile(f,f.name,f.type);e.target.value=''};
$('#ci').onchange=$('#fi').onchange;
addEventListener('pagehide',()=>{clearTimeout(saveT);persist()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);persist()}});
$('#ti').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const items=parseToc(await readText(f),/\.csv$/i.test(f.name));if(!items.length){toast('불러올 목차가 없어요. 형식·예시를 확인하세요');return}previewToc(items,f.name)}catch(err){toast('파일을 읽지 못했어요')}};
$('#bi').onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=''};

/* ---------- init ---------- */
(async()=>{
  db=await openDB();
  try{const d=await get('kv','data');if(d)S=Object.assign(S,d)}catch(e){}
  if(!S.subjects.find(x=>x.id===S.cur))S.cur=S.subjects[0]?.id||null;
  applyTheme();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
</body>
</html>
