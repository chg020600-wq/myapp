<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>콩닥 간호노트</title>
<style>
:root{--bg:#FFF9F2;--ink:#4A4458;--mute:#6B6479;--pk:#FFD6E0;--bl:#CDE7FF;--mt:#CFF1E3;--pu:#D9CCFF;--ok:#BFE8C5;--no:#FFD3C2;--ye:#FFE7A0;--line:#4A4458}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.w{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1,h2,p{margin:0}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top h1{flex:1;font-size:22px;line-height:1.3;min-width:130px}
.ib{width:44px;height:44px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-size:24px;cursor:pointer}
.btn{min-height:44px;padding:0 18px;border:2px solid var(--line);border-radius:16px;background:var(--pu);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.s{min-height:40px;padding:0 12px;font-size:14px;box-shadow:none;background:#fff}
.btn.d{background:var(--no)}
.btn.on{background:var(--ok)}
.btn:disabled{opacity:.4;cursor:default}
.pv{width:min(96vw,900px);height:88vh;padding:12px}
.pv[open]{display:flex;flex-direction:column}
.pv iframe{flex:1;width:100%;border:2px solid var(--line);border-radius:14px;background:#fff}
.pbar{height:10px;border:2px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:6px}
.pbar i{display:block;height:100%;background:var(--pu)}
.swwrap{margin:10px 0}
.sw{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.sw *{touch-action:pan-y;-webkit-user-drag:none}
.fc.big{height:min(52vh,340px)}
.fc.big .fa{font-size:28px}
.fc.big .fb{font-size:20px}
.tg{position:absolute;z-index:2;top:14px;padding:4px 12px;border:2px solid var(--line);border-radius:14px;font-weight:700;opacity:0;pointer-events:none}
.tl{left:14px;background:var(--ok)}
.tr{right:14px;background:var(--no)}
.sub{color:var(--mute);font-size:14px;margin:6px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:14px}
.list{display:grid;gap:12px;margin-bottom:14px}
.box{border:2px solid var(--line);border-radius:22px;padding:14px;background:#fff}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.box.row{border:2px solid var(--line);padding:14px}
.big{font-size:20px}
.ic{width:56px;height:56px;flex:none}
.ic.big{width:64px;height:64px}
.ic.sm{width:36px;height:36px}
.deco{display:flex;gap:10px;justify-content:center;margin:26px 0 8px}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;min-height:44px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--ye)}
.note,.warn{border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.note{background:var(--ye)}
.warn{background:var(--no)}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:4px}
.sm{min-height:120px;max-height:70vh;resize:none;overflow-y:auto;line-height:1.7}
.sm2{flex:1;resize:none;line-height:1.8;font-size:17px;margin:0}
.sc{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s}
.sc.hold{transform:scale(.97);transition-delay:.12s}
.sc.on{box-shadow:0 0 0 4px var(--pu);transform:scale(.98)}
[data-ro]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s}
[data-ro].hold{transform:scale(.97);transition-delay:.12s}
[data-ro].lift{transform:scale(1.03);box-shadow:0 8px 20px rgba(74,68,88,.3);position:relative;z-index:3}
.ri.lift{box-shadow:none;filter:drop-shadow(0 8px 10px rgba(74,68,88,.3))}
[data-ro].ph{background:transparent!important;border:2px dashed var(--line)!important;box-shadow:none!important;outline:none;opacity:.5;transform:none!important}
[data-ro].ph>*{visibility:hidden}
.ri.ph{border-radius:22px}
.ck{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s,background .15s;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;pointer-events:none}
.selm .ck{opacity:1;transform:none;animation:pop .18s}
.sc.on .ck{background:var(--pu)}
.sc.on .ck::after{content:'\2713'}
.top.sel{animation:fade .18s}
.hint{display:grid}
.hint>span{grid-area:1/1}
.hint>.h{visibility:hidden}
.cr{display:flex;align-items:center;gap:10px;font-weight:700;margin:6px 0;min-height:40px}
.cr input{width:22px;height:22px;padding:0;margin:0;flex:none;accent-color:#7B5FD6}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes fade{from{opacity:0}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
.inR{animation:inR .22s ease-out}
.inL{animation:inL .22s ease-out}
body{overflow-x:hidden}
.fc{perspective:1800px;height:150px}
.fi{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;will-change:transform;cursor:pointer}
.fc.f .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:700;font-size:21px;overflow:hidden}
.fb span{display:block;width:100%;max-height:100%;overflow:auto}
.cg{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:14px}
.cg .fc{height:108px}
.cg .fa{font-size:20px;padding:12px;border-radius:20px}
.cg .fb{font-size:15px;line-height:1.45;padding:12px;border-radius:20px}
.cg .acts{margin:6px 0 0;gap:8px;flex-wrap:nowrap}
.cg .acts .btn{flex:none;min-height:34px;padding:0 14px;font-size:13px}
.ri{position:relative}
.kn{margin-left:auto;display:flex;align-items:center;gap:6px;min-height:34px;padding:0 12px 0 8px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.kn::before{content:'';box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;text-align:center;font-size:12px;line-height:14px}
.kn.on{background:var(--ok)}
.kn.on::before{content:'\2713'}
.fa{background:var(--pk)}
.fb{background:var(--bl);transform:rotateY(180deg);font-size:17px}
.q{font-size:18px;font-weight:700;margin-bottom:8px}
.ch{display:block;width:100%;text-align:left;min-height:52px;margin:8px 0;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.ch:disabled{opacity:1;cursor:default}
.ch.ok{background:var(--ok)}
.ch.no{background:var(--no)}
.fb2{display:flex;gap:12px;align-items:center;margin:12px 0;background:var(--ye)}
dialog{border:2px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);width:min(92vw,460px);max-height:90vh;overflow:auto;padding:18px}
dialog::backdrop{background:rgba(74,68,88,.35)}
label{display:block;font-weight:700;margin:10px 0}
:focus-visible{outline:3px solid #8A6FE8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<g id="fc"><circle cx="19" cy="26" r="1.8" fill="#4A4458"/><circle cx="29" cy="26" r="1.8" fill="#4A4458"/><path d="M21 30q3 3 6 0" fill="none" stroke="#4A4458" stroke-width="1.8" stroke-linecap="round"/><circle cx="14.5" cy="30" r="2.4" fill="#FFB6C8" opacity=".75"/><circle cx="33.5" cy="30" r="2.4" fill="#FFB6C8" opacity=".75"/></g>
<symbol id="cloud" viewBox="0 0 48 48"><path d="M14 38a8 8 0 0 1-1-16 11 11 0 0 1 21-2 9 9 0 0 1 2 18z" fill="#fff" stroke="#4A4458" stroke-width="2" stroke-linejoin="round"/><use href="#fc"/></symbol>
<symbol id="star" viewBox="0 0 48 48"><polygon points="24,4 29.5,17 44,18 33,28 36.5,42 24,34.5 11.5,42 15,28 4,18 18.5,17" fill="#FFE7A0" stroke="#4A4458" stroke-width="2" stroke-linejoin="round"/><use href="#fc" transform="translate(0 -2)"/></symbol>
<symbol id="heart" viewBox="0 0 48 48"><path d="M24 42C8 30 6 20 6 15a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 5-2 15-18 27z" fill="#FFB6C8" stroke="#4A4458" stroke-width="2" stroke-linejoin="round"/><use href="#fc" transform="translate(0 -4)"/></symbol>
<symbol id="pill" viewBox="0 0 48 48"><g transform="rotate(-35 24 24)" stroke="#4A4458" stroke-width="2"><rect x="5" y="14" width="38" height="20" rx="10" fill="#fff"/><path d="M15 14h9v20h-9a10 10 0 0 1 0-20z" fill="#FFD6E0"/></g></symbol>
<symbol id="steth" viewBox="0 0 48 48"><path d="M12 7v12a8 8 0 0 0 16 0V7M20 27v5a8 8 0 0 0 16 0v-5" fill="none" stroke="#4A4458" stroke-width="3" stroke-linecap="round"/><circle cx="36" cy="23" r="4.5" fill="#fff" stroke="#4A4458" stroke-width="2.5"/></symbol>
<symbol id="syringe" viewBox="0 0 48 48"><g transform="rotate(45 24 24)" stroke="#4A4458" stroke-width="2" stroke-linecap="round"><rect x="18" y="12" width="12" height="22" rx="3" fill="#CDE7FF"/><path d="M24 34v9M15 12h18M24 4v8"/></g></symbol>
</defs>
</svg>
<div class="w" id="app"></div>
<dialog id="dg"></dialog>
<dialog id="pv" class="pv"></dialog>
<input type="file" id="fcsv" accept=".csv,text/csv" hidden>
<input type="file" id="fp" accept=".pdf,application/pdf" multiple hidden>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script type="module">
// Firebase는 앱이 먼저 뜬 뒤에 따로 불러와요. 연결이 안 돼도 앱은 이 기기 저장으로 그대로 작동해요.
const firebaseConfig = {
  apiKey: "AIzaSyDwNr7S0AmBQIOc0wgTuwuM475kpTPeUwc",
  authDomain: "naye-90033.firebaseapp.com",
  projectId: "naye-90033",
  storageBucket: "naye-90033.firebasestorage.app",
  messagingSenderId: "676463113164",
  appId: "1:676463113164:web:bfb881d71353aac8442369",
  measurementId: "G-H1R5V54G5H"
};
let initializeApp,getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,getFirestore,doc,setDoc,onSnapshot,fbApp,auth=null,db=null,provider=null,fbReady=false;

let fbUser = null, unsubDb = null, isRemoteUpdate = false, lastJson = '', pendingRemote = null;

const $=s=>document.querySelector(s),
esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid=()=>Math.random().toString(36).slice(2,9);
const KEY='kongdak-nursing-v1',CL=['#FFD6E0','#CDE7FF','#CFF1E3','#D9CCFF','#FFE7A0'],IC=['pill','heart','steth','cloud','star'],NUM='①②③④⑤';
const cd=(t,m)=>({id:uid(),term:t,meaning:m,known:false});
let bad=0,tm,nav={v:'home'},qz=null,D=load();
function seed(){return{subjects:[
{id:uid(),name:'의학용어',c:CL[0],i:'pill',units:[{id:uid(),name:'예시: 접두어·접미어 기초',ex:1,
summary:'접두어(단어 앞에 붙는 말)와 접미어(단어 뒤에 붙는 말)를 알면 처음 보는 의학용어도 뜻을 짐작할 수 있다.',
cards:[cd('hyper-','정상보다 많거나 높은 (예: hypertension 고혈압)'),cd('hypo-','정상보다 적거나 낮은 (예: hypotension 저혈압)'),cd('-itis','염증 (예: gastritis 위염)'),cd('tachy-','빠른 (예: tachycardia 빈맥)'),cd('brady-','느린 (예: bradycardia 서맥)')],
quiz:[
{id:uid(),question:'접미어 -itis의 뜻은 무엇일까요?',choices:['종양','출혈','염증','통증','마비'],answer:2,explanation:'-itis는 염증을 뜻해요. 예: gastritis(위염)'},
{id:uid(),question:'맥박이 느린 상태를 나타내는 용어는?',choices:['빈맥','고혈압','저혈압','부정맥','서맥'],answer:4,explanation:'brady-는 느리다는 뜻이라 bradycardia는 서맥이에요.'},
{id:uid(),question:'hypotension의 뜻은 무엇일까요?',choices:['고혈압','저혈압','빈맥','서맥','위염'],answer:1,explanation:'hypo-는 정상보다 낮다는 뜻이라 저혈압이에요.'}]}]},
{id:uid(),name:'해부생리',c:CL[1],i:'heart',units:[]},
{id:uid(),name:'기본간호학',c:CL[2],i:'steth',units:[]}]}}
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.subjects))return d}}catch(e){bad=1}return seed()}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D));bad=0}catch(e){bad=1}
  if(fbUser && !isRemoteUpdate){
    const j=JSON.stringify(D);
    if(j!==lastJson){
      lastJson=j;pendingRemote=null;
      setDoc(doc(db,'users',fbUser.uid,'apps','nursing'),{data:j,updatedAt:Date.now()}).catch(()=>{bad=1});
    }
  }
  ['#st','#st2'].forEach(q=>{const s=$(q);if(s)s.textContent=bad?'저장할 수 없어요':(fbUser?'클라우드 저장됨':'저장됨')});
}

const typing=()=>/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')||!!document.querySelector('dialog[open]')||!!rd;
function fixNav(){
  if(nav.s&&!D.subjects.some(x=>x.id==nav.s))nav={v:'home'};
  else if(nav.u&&!S().units.some(x=>x.id==nav.u))nav={v:'units',s:nav.s};
  sel=null;
}
function applyRemote(txt){
  if(typing()){pendingRemote=txt;return}   // 글을 쓰는 중이면 끝날 때까지 기다려요
  try{
    const r=JSON.parse(txt);
    if(!r||!Array.isArray(r.subjects))return;
    pendingRemote=null;lastJson=txt;
    isRemoteUpdate=true;D=r;
    try{localStorage.setItem(KEY,txt)}catch(e){}
    fixNav();render();
  }catch(e){}
  isRemoteUpdate=false;
}
setInterval(()=>{if(pendingRemote&&!typing())applyRemote(pendingRemote)},1500);
function watchAuth(){
  onAuthStateChanged(auth, user => {
    fbUser = user;
    if(unsubDb){ unsubDb(); unsubDb = null; }
    if(user){
      const ref = doc(db,'users',user.uid,'apps','nursing');
      unsubDb = onSnapshot(ref, snap => {
        if(snap.metadata.hasPendingWrites) return;            // 내가 방금 저장한 것의 알림은 무시
        const txt = snap.exists() ? snap.data().data : null;
        if(txt){ if(txt!==lastJson) applyRemote(txt); }
        else save();                                           // 클라우드가 비어 있으면 이 기기 내용을 올려요
      }, ()=>{});
    }
    render();
  });
}
async function initFirebase(){
  try{
    const B='https://www.gstatic.com/firebasejs/11.0.1/';
    const [a,u,f]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    ({initializeApp}=a);
    ({getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=u);
    ({getFirestore,doc,setDoc,onSnapshot}=f);
    fbApp=initializeApp(firebaseConfig);auth=getAuth(fbApp);db=getFirestore(fbApp);provider=new GoogleAuthProvider();
    fbReady=true;watchAuth();
  }catch(e){fbReady=false;render()}
}

const S=()=>D.subjects.find(x=>x.id==nav.s),U=()=>S().units.find(x=>x.id==nav.u);
const ic=(n,c='ic')=>`<svg class="${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const bar=(t,b)=>`<div class="top">${b?'<button class="ib" data-a="back" aria-label="뒤로">‹</button>':''}<h1>${esc(t)}</h1></div>`;
const empty=t=>`<div class="box empty">${ic('cloud','ic big')}<p>${t}</p></div>`;
const acts=(a,id)=>`<div class="acts"><button class="btn s" data-a="edit${a}" data-id="${id}">수정</button><button class="btn s d" data-a="del${a}" data-id="${id}">삭제</button></div>`;

function home(){
  const authBtn = fbUser
    ? `<button class="btn s on" data-a="logout" title="${esc(fbUser.email)}">동기화 중</button>`
    : (fbReady?`<button class="btn s" style="background:var(--ye)" data-a="login">로그인</button>`:'');
  return (sel?selBar(64)+hint('오늘은 어떤 과목을 볼까요? 과목을 길게 누르면 선택할 수 있어요.','과목을 눌러 선택하거나 해제해요.',1):`<div class="top">${ic('cloud','ic big')}<h1>콩닥 간호노트</h1>${authBtn}<button class="btn s" data-a="ld">불러오기</button><button class="btn s" data-a="set">설정</button></div>${hint('오늘은 어떤 과목을 볼까요? 과목을 길게 누르면 선택할 수 있어요.','과목을 눌러 선택하거나 해제해요.',0)}`)+`<div class="grid${sel?' selm':''}">${D.subjects.map(s=>`<button class="box row sc${sel&&sel.includes(s.id)?' on':''}" style="background:${s.c}" data-a="${sel?'tog':'openS'}" data-id="${s.id}" data-ro="S"><i class="ck"></i>${ic(s.i)}<span><b class="big">${esc(s.name)}</b><br><small>단원 ${s.units.length}개</small></span></button>`).join('')}</div>${sel?'':'<div class="acts"><button class="btn" style="background:var(--ye)" data-a="hq">과목 퀴즈</button><button class="btn" data-a="addS">+ 과목 추가</button></div>'}<div class="deco">${['star','heart','pill','steth','syringe'].map(n=>ic(n,'ic sm')).join('')}</div>`;
}

function parseCSV(t){const rows=[];let r=[],c='',q=0;t=t.replace(/^\uFEFF/,'');

if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
else if(ch=='"')q=1;
else if(ch==','){r.push(c);c=''}
else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
else c+=ch}
if(c!==''||r.length){r.push(c);rows.push(r)}
return rows.filter(x=>x.some(y=>y.trim()))}

for(const r of rows){const sn=(r[ia]||'').trim(),un=(r[ib]||'').trim(),t=(r[ic2]||'').trim(),mn=(r[id]||'').trim(),memo=im<0?'':(r[im]||'').trim();

const drEnd=(e,cancel)=>{if(!dr)return;const {dx,m,w}=dr;dr=null;if(!cancel&&dx<-90)return fly(true);if(!cancel&&dx>90)return fly(false);w.style.transition='transform .2s';w.style.transform='';w.querySelectorAll('.tg').forEach(t=>t.style.opacity=0);if(!cancel&&!m)w.querySelector('.fc').classList.toggle('f')};
document.addEventListener('pointerup',e=>drEnd(e,0));
document.addEventListener('pointercancel',e=>drEnd(e,1));
document.addEventListener('keydown',e=>{if(nav.v!='unit'||nav.tab!='study'||!sd||sd.i>=sd.ids.length||$('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowLeft')fly(true);else if(e.key=='ArrowRight')fly(false);else if(e.key==' '&&e.target.tagName!='BUTTON'){e.preventDefault();const f=$('#sw .fc');if(f)f.classList.toggle('f')}});
function rok(){return nav.v=='home'||nav.v=='units'||(nav.v=='unit'&&(nav.tab=='card'||nav.tab=='quiz'))}
function liftStart(it,x,y){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}it.classList.add('lift');rd={it,x0:x,y0:y,drag:0,k:it.dataset.ro,c:it.parentElement,px:null,py:null}}
function dragStart(e){const it=rd.it,r=it.getBoundingClientRect(),cl=it.cloneNode(true);
cl.classList.remove('lift','hold');cl.removeAttribute('data-ro');cl.removeAttribute('data-a');cl.querySelectorAll('[data-a]').forEach(x=>x.removeAttribute('data-a'));
Object.assign(cl.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'50',transform:'scale(1.03)',...(cl.classList.contains('ri')?{filter:'drop-shadow(0 10px 12px rgba(74,68,88,.35))'}:{boxShadow:'0 10px 24px rgba(74,68,88,.35)'}),transition:'none'});
document.body.appendChild(cl);try{cl.setPointerCapture(e.pointerId)}catch(x){}
rd.cl=cl;rd.ox=rd.x0-r.left;rd.oy=rd.y0-r.top;rd.drag=1;it.classList.remove('lift');it.classList.add('ph');rd.raf=requestAnimationFrame(tick)}
function dragMove(){if(!rd||rd.px==null)return;const{cl,px,py,ox,oy,it,c}=rd;cl.style.left=(px-ox)+'px';cl.style.top=(py-oy)+'px';
const cr=c.getBoundingClientRect(),X=px-cr.left,Y=py-cr.top,L=k=>({l:k.offsetLeft-c.offsetLeft,t:k.offsetTop-c.offsetTop,w:k.offsetWidth,h:k.offsetHeight});
const all=[...c.children].filter(k=>k.dataset.ro),t=all.find(k=>k!==it&&(r=>X>=r.l&&X<=r.l+r.w&&Y>=r.t&&Y<=r.t+r.h)(L(k)));
if(!t)return;
const ti=all.indexOf(t),ci=all.indexOf(it),rt=L(t),ri=L(it),vert=new Set(all.map(k=>L(k).l)).size==1,same=!vert&&Math.abs(rt.t-ri.t)<10;
const pass=ti>ci?(same?X>rt.l+rt.w/2:Y>rt.t+rt.h/2):(same?X<rt.l+rt.w/2:Y<rt.t+rt.h/2);
if(!pass)return;
const before=new Map(all.map(k=>[k,k.getBoundingClientRect()]));
c.insertBefore(it,ti<ci?t:t.nextSibling);
all.forEach(k=>{if(k===it)return;const a=before.get(k),b=k.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;if(dx||dy)k.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:180,easing:'ease-out'})})}
function tick(){if(!rd||!rd.drag)return;const y=rd.py;if(y!=null){if(y<90)scrollBy(0,-12);else if(y>innerHeight-90)scrollBy(0,12);dragMove()}rd.raf=requestAnimationFrame(tick)}
function commitOrder(r){const ids=[...r.c.children].filter(k=>k.dataset.ro).map(k=>k.dataset.id),arr=r.k=='S'?D.subjects:r.k=='U'?S().units:r.k=='C'?U().cards:U().quiz,vis=arr.filter(x=>ids.includes(x.id)),slots=arr.map((x,i)=>ids.includes(x.id)?i:-1).filter(i=>i>=0);
ids.forEach((id,k)=>{arr[slots[k]]=vis.find(x=>x.id==id)});save();if(r.k=='Q')[...r.c.children].filter(k=>k.dataset.ro).forEach((k,i)=>{const t=k.querySelector('b'),q=arr.find(x=>x.id==k.dataset.id);if(t&&q)t.textContent=(i+1)+'. '+q.question})}
document.addEventListener('pointerdown',e=>{lpF=0;if(e.button||rd||!rok())return;const it=e.target.closest('[data-ro]');if(!it)return;const bt=e.target.closest('button');if(bt&&bt!==it)return;lp={x:e.clientX,y:e.clientY};it.classList.add('hold');clearTimeout(lt);lt=setTimeout(()=>{lt=null;lpF=1;it.classList.remove('hold');liftStart(it,lp.x,lp.y)},500)});
document.addEventListener('pointermove',e=>{if(lt&&lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){document.querySelectorAll('.hold').forEach(x=>x.classList.remove('hold'));clearTimeout(lt);lt=null}
if(!rd)return;if(!rd.drag){if(Math.hypot(e.clientX-rd.x0,e.clientY-rd.y0)>8)dragStart(e);else return}
rd.px=e.clientX;rd.py=e.clientY;dragMove()});
document.addEventListener('touchmove',e=>{if(rd&&e.cancelable)e.preventDefault()},{passive:false});
const lpEnd=e=>{document.querySelectorAll('.hold').forEach(x=>x.classList.remove('hold'));clearTimeout(lt);lt=null;const r=rd;rd=null;
if(r){cancelAnimationFrame(r.raf);r.it.classList.remove('lift','ph');
if(r.cl){r.cl.remove();commitOrder(r)}
else if(e&&e.type=='pointerup'&&(r.k=='S'||r.k=='U')){if(sel)A.tog({id:r.it.dataset.id},r.it);else enterSel(r.it.dataset.id)}}
if(lpF){lpF=0;skipT=Date.now()+100}};
document.addEventListener('pointerup',lpEnd);
document.addEventListener('pointercancel',lpEnd);
document.addEventListener('contextmenu',e=>{if(rok()&&e.target.closest('[data-ro]'))e.preventDefault()});
$('#fcsv').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)doCsv(f)};
$('#fp').onchange=e=>{const fl=[...e.target.files];e.target.value='';if(fl.length&&pdfT)addPdf(fl,pdfT.s,pdfT.u)};
save();render();
initFirebase();
</script>
